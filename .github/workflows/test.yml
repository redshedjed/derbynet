name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TERM: xterm
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # The build derives a version number from the commit count

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y ant jq libxml2-utils

    # Building the PDF documents needs LibreOffice, which the tests don't use.
    # Without it, the build skips them, but still expects this one to exist.
    - name: Generate website files
      run: |
        mkdir -p docs/dist
        touch "docs/dist/Quick Reference.pdf"
        ant -noinput generated timer-in-browser

    - name: Build server image
      run: docker build -t derbynet_server -f installer/docker/Dockerfile .

    - name: Start server
      run: |
        docker run --detach --name derbynet -p 8080:80 derbynet_server
        for i in $(seq 1 30); do
          curl -fsS -o /dev/null http://localhost:8080/about.php && exit 0
          sleep 2
        done
        echo "Server didn't respond"
        exit 1

    - name: Check PHP syntax
      run: |
        failures=$(docker exec derbynet sh -c '
          find /var/www/html \( -name "*.php" -o -name "*.inc" \) |
          while read -r f; do
            php84 -l "$f" > /tmp/lint.out 2>&1 ||
              echo "$f: $(grep -m 1 -i error /tmp/lint.out)"
          done')
        if [ -n "$failures" ]; then
          echo "$failures" | while read -r line; do echo "::error::$line"; done
          exit 1
        fi

    - name: Install browser test dependencies
      working-directory: testing
      run: |
        npm install --no-save puppeteer
        # Ubuntu 24.04 otherwise blocks the browser's sandbox
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Run test suite
      shell: bash  # Unlike the default, this includes pipefail
      run: |
        # The test scripts use macOS's md5 command
        printf '#!/bin/sh\nmd5sum | cut -d" " -f1\n' | sudo tee /usr/local/bin/md5 > /dev/null
        sudo chmod +x /usr/local/bin/md5
        testing/exercise-one-database.sh localhost:8080 ez 2>&1 | tee suite.log

    - name: Run timer hardware test
      shell: bash
      run: testing/test-timer-hardware.sh localhost:8080 2>&1 | tee -a suite.log

    - name: Summarize test failure
      if: failure()
      run: tail -n 8 suite.log | while read -r line; do echo "::error::$line"; done

    - name: Show server log
      if: failure()
      run: docker logs derbynet 2>&1 | tail -n 200

    - name: Upload test transcript
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-transcript
        path: testing/*.curl
