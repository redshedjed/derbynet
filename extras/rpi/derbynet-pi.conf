# DerbyNet Raspberry Pi configuration
#
# This file lives on the SD card's boot partition, so it can be edited from a
# Windows, Mac, or Linux computer: power off the Pi, put the card in the
# computer, edit this file, put the card back, and power on.  Changes take
# effect at the next boot (or immediately with "sudo derbynet-pi apply").
#
# Settings here override /etc/derbynet.conf.

# ROLES: what this Pi does.  Any combination of these, separated by spaces:
#
#   server   Runs the DerbyNet web server, and announces it on the local
#            network so the other Pis find it automatically.  It also answers
#            to SERVER_ALIAS (below), so people can browse to
#            http://derbynet.local/derbynet
#   standby  Runs a copy of the web server that mirrors the server's database
#            and photos (copies are at most about 40 seconds old).  If the
#            server dies, power it off and run "sudo derbynet-pi promote" on
#            the standby (or change its ROLES to server and reboot).  The
#            standby then announces itself and takes over the alias, and the
#            other Pis switch to it on their own.  Can't be combined with
#            server.
#   kiosk    Shows a full-screen kiosk browser.  What it is -- a display, a
#            track camera, or a photo stand (camera plus USB barcode scanner)
#            -- and all its settings are chosen on DerbyNet's Kiosk Dashboard,
#            not here.  A display with its own webcam on the track: give its
#            location a camera name in the Kiosk Editor.
#            (The older roles "replay" and "photo" mean kiosk.)
#
# Examples:
#   ROLES="server kiosk"     the whole race on one Pi
#   ROLES="kiosk"            a display, track camera or photo stand
#   ROLES="standby"          a hot spare
ROLES="kiosk"

# An extra network name the server publishes, as <alias>.local, alongside its
# own hostname (which is left alone).  Whichever Pi is the server holds it, so
# http://derbynet.local/derbynet keeps working after a standby takes over.
# Use the same value on every Pi.  Set to "" to not publish an alias.
SERVER_ALIAS="derbynet"

# Where kiosks and the standby find the server.
# Normally leave this commented out: they find the server automatically,
# because it announces itself.  Set it only if the server isn't a Pi set up by
# setup.sh (e.g. a laptop); a Pi with this set never switches servers on its
# own.
# DERBYNET_SERVER="http://192.168.1.100/derbynet"

# Shared password for server-to-standby copying.  Required for the standby
# role.  Must be the same on the server and the standby.
SYNC_PASSWORD=""

# Kiosk identity.  Normally derived from the Pi's serial number, so it survives
# reboots.  Set only if you want a friendlier name on the Kiosk Dashboard; no
# two kiosks may share one.
# ADDRESS="lobby"
